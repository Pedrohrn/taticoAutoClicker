<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Controle - Tatico</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* sobreponho a formatacao global flex que estica e quebra a box limitante do popup da extensao */
    body {
      display: block;
      width: 250px;
      height: auto;
      padding: 15px;
      margin: 0;
      background-color: var(--sidebar-bg);
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header img {
      max-width: 120px;
      height: auto;
    }

    .status-container {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
      color: var(--text-main);
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="logo.png" alt="Tatico">
  </div>
  <div class="status-container" id="textoStatus">Status: Verificando...</div>

  <button id="btnToggle" class="btn btn-success" style="width: 100%; margin-bottom: 10px;">Iniciar Revolver</button>
  <button id="btnOpcoes" class="btn btn-info" style="width: 100%; margin-bottom: 20px;">Configurações</button>

  <div id="btnToggleTheme" class="theme-switch"
    style="border-top: 1px solid var(--border-color); padding-top: 15px; margin: 0;">
    <span>Light</span>
    <div class="theme-switch-pill"></div>
    <span>Dark</span>
  </div>

  <script src="popup.js"></script>
</body>

</html>
