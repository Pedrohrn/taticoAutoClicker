<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Tatico Recorder - Edição</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body class="tatico-page editor-page" data-theme="dark">
  <div class="editor-header">
    <img src="/logo.png" alt="Tatico" class="editor-logo" style="max-width: 120px;">
    <h2>Gravação Concluída</h2>
  </div>

  <div id="loading" class="status-box">Recuperando arquivo do banco local...</div>

  <div class="editor-container" id="editorContainer" style="display:none;">

    <div class="tools-section">
      <button id="btnDownload" class="btn btn-primary btn-block" style="margin-bottom: 15px;">⬇ Baixar Vídeo
        Original</button>

      <div class="tools-card" id="divTrimming">
        <h4>✂ Edição</h4>

        <label>Linha do Tempo (Deslize para navegar):</label>
        <input type="range" id="timeline" min="0" value="0" step="0.1" class="timeline-slider">
        <div class="time-display"><span id="currentTimeDisplay">0.0</span>s / <span id="durationDisplay">0.0</span>s
        </div>

        <fieldset>
          <legend>Cortar Pontas</legend>
          <div class="flex-row">
            <label>Início (s): <input type="number" id="trimStart" value="0" min="0" step="0.1"></label>
            <label>Fim (s): <input type="number" id="trimEnd" value="0" min="0" step="0.1"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Excluir Trecho Específico</legend>
          <div class="flex-row">
            <label>De (s): <input type="number" id="cutStart" value="0" min="0" step="0.1"></label>
            <label>Até (s): <input type="number" id="cutEnd" value="0" min="0" step="0.1"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Mutar Áudio de Trecho</legend>
          <div class="flex-row">
            <label>De (s): <input type="number" id="muteStart" value="0" min="0" step="0.1"></label>
            <label>Até (s): <input type="number" id="muteEnd" value="0" min="0" step="0.1"></label>
          </div>
        </fieldset>

        <button id="btnTrim" class="btn btn-secondary btn-block" style="margin-top: 15px;">▶ Processar Novo
          Vídeo</button>
        <div id="trimStatus" class="status-box" style="display:none; margin-top: 10px; color: #17a2b8;"></div>
      </div>
    </div>

    <div class="video-section">
      <video id="vidFinal" controls></video>
    </div>

  </div>

  <script src="/pages/recorder/editor.js"></script>
</body>

</html>
